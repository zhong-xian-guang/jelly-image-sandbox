<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Renderer 檢視 · JellyRenderer（PixiJS 貼圖網格）</title>
    <style>
      :root {
        --accent: #1f9d74;
        --ink: #1b2320;
        --muted: #6b7a74;
        --line: #dfe6e2;
        --bg: #f6f8f7;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          Roboto,
          "Noto Sans TC",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        display: flex;
        min-height: 100%;
      }
      #stage {
        flex: 1 1 auto;
        position: relative;
        min-width: 0;
        background: #101614;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      aside {
        flex: 0 0 300px;
        max-width: 300px;
        padding: 18px;
        overflow-y: auto;
        background: #fff;
        border-left: 1px solid var(--line);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.lede {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .tag {
        display: inline-block;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: #ffe9c7;
        color: #8a5a12;
        margin-left: 6px;
        vertical-align: 1px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0;
      }
      .state {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--bg);
        margin-top: 14px;
      }
      .state div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        font-variant-numeric: tabular-nums;
      }
      .state div span:first-child {
        color: var(--muted);
      }
      code {
        background: #eef2f0;
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 11px;
      }
      .err {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <aside>
      <h1>Renderer 檢視 <span class="tag">拋棄式 harness</span></h1>
      <p class="lede">
        <code>JellyRenderer</code>（PixiJS <code>Mesh</code>，WebGL）把程序化 Jelly 的原圖貼在
        <code>SimMesh</code> 三角網上。<b>在畫面上拖任一頂點</b>，看貼圖在該處連續扭曲、三角形之間無縫。
        求解器沒有參與——只是手動改 <code>positions</code> 再交給 Renderer。
      </p>

      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button id="reset">重設頂點</button>
        <button id="wobble">隨機抖動一下</button>
      </div>

      <label class="row"><input type="checkbox" id="showWire" /> 疊線框（看接縫）</label>

      <div class="state">
        <div><span>頂點 / 三角形</span><span id="s-mesh">–</span></div>
        <div><span>拖曳中頂點</span><span id="s-drag">–</span></div>
        <div><span>FPS</span><span id="s-fps">–</span></div>
        <div><span>後端</span><span id="s-backend">–</span></div>
      </div>

      <p class="lede" id="err" style="margin-top: 12px"></p>
    </aside>

    <script type="module" src="./renderer.prototype.ts"></script>
  </body>
</html>
